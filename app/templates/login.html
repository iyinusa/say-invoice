<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b6b46">
  <title>Sign in · SayInvoice</title>
  <link rel="icon" type="image/svg+xml" href="/static/icons/icon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/app.css?v={{ v }}">
</head>
<body>
<main class="app login">
  <header class="topbar"><span class="brand">Say<b>Invoice</b></span></header>
  <section class="screen">
    <h1>Sign in</h1>
    <p class="hint">Enter the passcode for this SayInvoice. You'll stay signed in on this device for 30 days.</p>
    <form class="card" method="post" action="/login" autocomplete="on">
      <div class="field">
        <label class="field-label" for="passcode">Passcode</label>
        <input id="passcode" class="control" name="passcode" type="password" autocomplete="current-password"
               required autofocus maxlength="200" aria-describedby="{{ 'login-error' if error else '' }}">
      </div>
      {% if error %}<p class="error" id="login-error" role="alert">{{ error }}</p>{% endif %}
      <button class="btn primary big" type="submit">Sign in</button>
    </form>
    <p class="field-help login-note">Clients never need this: the quote and payment links you send them open on their own.</p>
  </section>
</main>
</body>
</html>
