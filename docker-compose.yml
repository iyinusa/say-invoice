# Local Docker run: `docker compose up --build`, then open http://localhost:8000
#
# Settings come from .env (never baked into the image). With the default SQLite
# URL (./data/sayinvoice.db) the database lives in the `sayinvoice-data` volume,
# so it survives rebuilds; point SI_DATABASE_URL at Postgres to use that instead.
services:
  app:
    build:
      context: .
      args:
        # true adds the KokoroTTS server voice (set SI_TTS_ENGINE=kokoro to use it)
        INSTALL_TTS: ${SI_INSTALL_TTS:-false}
    image: sayinvoice:dev
    env_file: .env
    ports:
      - "${SI_PORT:-8000}:8000"
    volumes:
      - sayinvoice-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  sayinvoice-data:
