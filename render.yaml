# Render Blueprint: one click deploys the app and its database.
# Secrets are `sync: false`, so Render asks for them during setup.
services:
  - type: web
    name: sayinvoice
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: SI_ENV
        value: production
      - key: SI_DATABASE_URL
        fromDatabase:
          name: sayinvoice-db
          property: connectionString
      - key: SI_PUBLIC_BASE_URL
        sync: false
      - key: SI_PAYPAL_ENV
        value: sandbox
      - key: SI_PAYPAL_CLIENT_ID
        sync: false
      - key: SI_PAYPAL_CLIENT_SECRET
        sync: false
      - key: SI_PAYPAL_MERCHANT_EMAIL
        sync: false
      - key: SI_PAYPAL_WEBHOOK_ID
        sync: false
      - key: SI_GOOGLE_API_KEY
        sync: false
      - key: SI_GEMINI_MODEL
        value: gemini-3.5-flash
      - key: SI_GEMINI_THINKING_LEVEL
        value: minimal

databases:
  - name: sayinvoice-db
    plan: basic-256mb
    databaseName: sayinvoice
    user: sayinvoice
