# Render Blueprint: one click deploys the app, the Chase Agent's hourly run and the database.
# Secrets live in one env group with `sync: false`, so Render asks for them once.
envVarGroups:
  - name: sayinvoice-shared
    envVars:
      - key: SI_ENV
        value: production
      - key: SI_PUBLIC_BASE_URL
        sync: false
      - key: SI_PAYPAL_ENV
        value: sandbox
      - key: SI_PAYPAL_CLIENT_ID
        sync: false
      - key: SI_PAYPAL_CLIENT_SECRET
        sync: false
      - key: SI_PAYPAL_MERCHANT_EMAIL
        sync: false
      - key: SI_PAYPAL_WEBHOOK_ID
        sync: false
      - key: SI_GOOGLE_API_KEY
        sync: false
      - key: SI_GEMINI_MODEL
        value: gemini-3.5-flash
      - key: SI_GEMINI_THINKING_LEVEL
        value: minimal

services:
  - type: web
    name: sayinvoice
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - fromGroup: sayinvoice-shared
      - key: SI_DATABASE_URL
        fromDatabase:
          name: sayinvoice-db
          property: connectionString

  # The Chase Agent: every hour, check overdue invoices and draft (or send) reminders.
  - type: cron
    name: sayinvoice-chase
    runtime: docker
    plan: starter
    schedule: "0 * * * *"
    dockerCommand: python -m scripts.run_chase
    envVars:
      - fromGroup: sayinvoice-shared
      - key: SI_DATABASE_URL
        fromDatabase:
          name: sayinvoice-db
          property: connectionString

databases:
  - name: sayinvoice-db
    plan: basic-256mb
    databaseName: sayinvoice
    user: sayinvoice
